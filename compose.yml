services:
  frontend:
    container_name: frontend
    image: nginx:1.31.1
    restart: always
    networks:
      - main-network
    ports:
      - 80:80
    volumes:
      - ../app/frontend/dist:/usr/share/nginx/html:ro
      - ../app/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro

